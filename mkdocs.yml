site_name: Emas by Taufik
site_url: https://emas.taufik.fyi/
site_description: Panduan simpan emas fizikal untuk orang baru, step by step, daripada Taufik Bin Musa (Dealer Public Gold).
site_author: Taufik Bin Musa
repo_url: https://github.com/taufikmusa/emas
edit_uri: edit/main/docs/
copyright: Penafian, website ini dimiliki oleh Taufik, PGCode PG00359605 (Dealer Public Gold), dan bukan website rasmi Public Gold Marketing Sdn. Bhd.

theme:
  name: material
  language: ms
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mod gelap
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mod cerah
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.suggest
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: ms

extra:
  analytics:
    provider: google
    property: G-QML87QNZMR
  social:
    - icon: fontawesome/brands/whatsapp
      link: https://wa.me/60132740711
      name: WhatsApp Taufik
    - icon: material/web
      link: https://pg2u.my/taufikmusa
      name: Profil dealer

nav:
  - Utama: index.md
  - Daftar & Mula:
      - Cara Daftar Public Gold GAP: artikel/cara-daftar-public-gold-gap-2026.md
