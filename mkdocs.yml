site_name: Emas · By Taufik
site_url: https://emas.taufik.fyi/
site_description: Panduan dan ilmu emas untuk anda yang nak mulakan simpanan emas di Public Gold. Mudah, selamat, patuh syariah.
site_author: Taufik Bin Musa
copyright: Penafian, website ini dimiliki oleh Taufik, PGCode PG00359605 (Dealer Public Gold), dan bukan website rasmi Public Gold Marketing Sdn. Bhd.

theme:
  name: material
  custom_dir: overrides
  language: ms
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mod gelap
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mod cerah
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.suggest

extra_css:
  - https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/whatsapp.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: ms

extra:
  generator: false
  whatsapp_url: https://api.whatsapp.com/send/?phone=60132740711&text=Boleh+guide+saya+simpan+emas+Public+Gold&type=phone_number&app_absent=0
  analytics:
    provider: google
    property: G-QML87QNZMR
  social:
    - icon: fontawesome/brands/whatsapp
      link: https://api.whatsapp.com/send/?phone=60132740711&text=Boleh+guide+saya+simpan+emas+Public+Gold&type=phone_number&app_absent=0
      name: WhatsApp Taufik
    - icon: material/web
      link: https://pg2u.my/taufikmusa
      name: Profil dealer

nav:
  - Utama: index.md
  - Daftar & Mula:
      - Cara Daftar Public Gold GAP: artikel/cara-daftar-public-gold-gap-2026.md
  - PG Jewel:
      - Cara Miliki Barang Kemas Melalui Akaun GAP: artikel/cara-miliki-barang-kemas-pg-jewel-akaun-gap.md
  - Untuk Cikgu:
      - 5 Sebab Cikgu Simpan Emas: artikel/5-sebab-cikgu-golongan-paling-sesuai-simpan-emas.md
